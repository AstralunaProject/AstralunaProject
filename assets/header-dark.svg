<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="AstralunaProject: games, tools, automation and whatever else compiles">
<defs>
  <linearGradient id="ceu" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1026"/><stop offset=".55" stop-color="#1a1446"/><stop offset="1" stop-color="#2b1b5a"/>
  </linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#f5e6b8" stop-opacity=".45"/><stop offset="1" stop-color="#f5e6b8" stop-opacity="0"/></radialGradient>
  <mask id="crescente"><circle cx="860" cy="92" r="44" fill="#fff"/><circle cx="880" cy="78" r="40" fill="#000"/></mask>
