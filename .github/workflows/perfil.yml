name: Perfil

on:
  schedule:
    - cron: "17 9 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Cards de estatísticas e contribuições
        run: node scripts/cards.mjs --saida=dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cobrinha do gráfico de contribuições
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobrinha-light.svg?color_snake=#f772a3&color_dots=#ebedf0,#e1d4ff,#c3a6ff,#9b6dff,#6f3fe0
            dist/cobrinha-dark.svg?color_snake=#ff9ec4&color_dots=#161b22,#2e2566,#4b3a9e,#7a5ad6,#c9a7ff
      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: Atualiza cards do perfil
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
